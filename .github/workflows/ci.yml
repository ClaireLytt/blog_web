name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check en/zh post pairing (warn only)
        run: node .github/scripts/check-i18n-pairs.mjs

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --root-dir ${{ github.workspace }}/dist
            --include-fragments
            'dist/**/*.html'
          fail: true

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  external-links:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --scheme https --scheme http
            --exclude 'localhost'
            --exclude '(twitter|x)\.com'
            --max-retries 3
            --timeout 20
            'dist/**/*.html'
          fail: true
